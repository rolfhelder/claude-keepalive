name: Bug report
description: Report something that is broken or behaving unexpectedly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Issues are public: do not paste session content, tokens or credentials.
        Security problems go to the [security policy](https://github.com/rolfhelder/claude-keepalive/security/policy) instead.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: dropdown
    id: command
    attributes:
      label: Command
      description: Which command or part of the plugin is affected?
      options:
        - "/keepalive on"
        - "/keepalive off"
        - "/keepalive on --global"
        - "/keepalive off --global"
        - "/keepalive setup"
        - "/keepalive margin"
        - "/keepalive view"
        - "Automatic ping (no command)"
        - "Other"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Start from a fresh session. Include the exact command you ran.
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead. Paste any error output.
    validations:
      required: true
  - type: input
    id: claude-version
    attributes:
      label: Claude Code version
      description: Output of `claude --version`
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "macOS 15.5 arm64 / Ubuntu 24.04 x86_64"
    validations:
      required: true
  - type: input
    id: install
    attributes:
      label: Install method
      description: Marketplace name, or local path install
    validations:
      required: true
  - type: textarea
    id: settings
    attributes:
      label: Plugin settings
      description: Your userConfig values (`placement`).
      placeholder: |
        placement: ...
      render: yaml
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "Run `claude --debug` and copy only the lines that mention `keepalive`. Redact anything private."
      placeholder: "[DEBUG] ... keepalive ..."
      render: text
  - type: checkboxes
    id: redacted
    attributes:
      label: Privacy
      options:
        - label: I removed session content, tokens and private paths from this report
          required: true
